/* ===== LOCAL STORAGE (IndexedDB) ===== */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('bosman_pouch',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('clients'))d.createObjectStore('clients',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>toast('Close other open copies of this app, then reopen it')});
const all=async()=>{const d=await DB;return new Promise(r=>{const q=d.transaction('clients').objectStore('clients').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})};
const put=async c=>{const d=await DB;return new Promise(r=>{const t=d.transaction('clients','readwrite');t.objectStore('clients').put(c);t.oncomplete=r;t.onerror=r})};

/* ===== LOGIN / ROLES ===== */
function loginView(){shell(`<div class="wrap"><img class="logo" src="${LOGO}" alt=""><h1>${CFG.brand}</h1>
<input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" onclick="login()">Sign in</button><button class="lnk" onclick="forgot()">Forgot password?</button><div id="instbox"></div><p id="msg" class="muted"></p></div>`);upInst()}
const say=m=>{const e=$('#msg');if(e)e.textContent=m};
async function loadMe(e){if(e===CFG.admin)return{email:e,name:'Admin',sid:'ADMIN',role:'admin'};if(e===CFG.owner)return{email:e,name:'Owner',sid:'OWNER',role:'owner'};
 const d=await db.collection('staff').doc(e).get();if(!d.exists){await auth.signOut();throw new Error('This email is not registered as staff.')}
 const x=d.data();return{email:e,name:x.name,sid:x.sid,role:'staff',tmp:!!x.tmp}}
async function login(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;if(!e||!p)return say('Enter email and password.');say('Signing in…');
 try{if(!auth)throw{code:'auth/network-request-failed'};await auth.signInWithEmailAndPassword(e,p);me=await loadMe(e);
  localStorage.bos_cred=JSON.stringify({h:await hash(e,p),me});localStorage.removeItem('bos_locked');
  if(me.tmp&&!localStorage['bos_pw_'+e])await changePw(true,p);start()}
 catch(x){if(x.code==='auth/network-request-failed'||!navigator.onLine){let cr=null;try{cr=JSON.parse(localStorage.bos_cred)}catch(_){}
   if(cr&&cr.me.email===e&&cr.h===await hash(e,p)){me=cr.me;localStorage.removeItem('bos_locked');return start()}
   return say('Offline: sign in online once first, or check your details.')}
  if(/invalid|user-not-found/.test(x.code||'')&&(e===CFG.admin||e===CFG.owner)&&confirm('No account found for this email, or the password is different. If this is your first time, create the account now with the password you typed?')){try{await auth.createUserWithEmailAndPassword(e,p);return login()}catch(y){return say(y.code==='auth/email-already-in-use'?'That account exists, so the password is wrong. Tap Forgot password.':y.message)}}
 say(/invalid|wrong|user-not-found/.test(x.code||'')?'Wrong email or password (or this account is not created yet).':x.message)}}
async function forgot(){const e=$('#le').value.trim();if(!e)return say('Type your email first.');try{await auth.sendPasswordResetEmail(e);say('Reset email sent.')}catch(x){say(x.message)}}
async function changePw(forced,cur0){const c=cur0||prompt('Current password');if(!c)return;const n=prompt(forced?'Create your permanent password (min 6 characters)':'New password (min 6 characters)');
 if(!n||n.length<6)return toast('Password not changed');
 try{const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,c));await u.updatePassword(n);
  localStorage['bos_pw_'+me.email]=1;localStorage.bos_cred=JSON.stringify({h:await hash(me.email,n),me});toast('Password changed')}catch(x){toast(x.message)}}
function lock(){localStorage.bos_locked=1;me=null;loginView()}

let REP='';
let FR={k:'week',v:''},FRR=[];
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)};
function frRange(){const k=FR.k,v=FR.v;if(k==='day'){const d=v||iso(new Date());return[d,d]}
 if(k==='week'){const d=v?new Date(v+'T00:00'):mon(new Date());return[iso(d),iso(new Date(d.getTime()+6*864e5))]}
 if(k==='month'){const m=v||iso(new Date()).slice(0,7);return[m+'-01',iso(new Date(+m.slice(0,4),+m.slice(5,7),0))]}
 const y=v||String(new Date().getFullYear());return[y+'-01-01',y+'-12-31']}
function frOpts(){const n=new Date();if(FR.k==='day')return`<input type="date" id="frv" value="${FR.v||iso(n)}" onchange="FR.v=this.value;finRep()">`;const o=[];
 if(FR.k==='week')for(let i=0;i<12;i++){const d=mon(new Date(n.getTime()-i*7*864e5));o.push([iso(d),`Week ${isoWeek(d)}, ${d.getFullYear()}`])}
 else if(FR.k==='month')for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);o.push([iso(d).slice(0,7),d.toLocaleString('default',{month:'long'})+' '+d.getFullYear()])}
 else for(let i=0;i<5;i++)o.push([String(n.getFullYear()-i),String(n.getFullYear()-i)]);
 return`<select id="frv" onchange="FR.v=this.value;finRep()">${o.map(([v,l])=>`<option value="${v}" ${(FR.v||o[0][0])===v?'selected':''}>${l}</option>`).join('')}</select>`}
function finRep(k){if(k&&k!==FR.k){FR.k=k;FR.v=''}const[f,t]=frRange();let billed=0,paidT=0,owedAll=0,nv=0;const rows=[];
 for(const c of cache.filter(c=>!c.deleted)){const al=[...(c.visits||[]).filter(v=>!v.del).map(v=>({...v,d:v.date})),{...c,d:c.vdate||(c.updated||'').slice(0,10)}];let b=0,p=0;
  for(const v of al){const inn=v.d>=f&&v.d<=t,pays=(v.pay||[]).filter(x=>!x.del&&x.date>=f&&x.date<=t).reduce((s,x)=>s+(+x.amt||0),0);if(inn){b+=+v.total||0;p+=+v.deposit||0;nv++}p+=pays}
  owedAll+=al.reduce((s,v)=>s+(+v.total||0)-(+v.deposit||0)-paid(v),0);billed+=b;paidT+=p;if(b||p)rows.push([c,b,p])}
 FRR=rows;const lab={day:'Daily',week:'Weekly',month:'Monthly',year:'Annual'}[FR.k],rec={em:localStorage.bos_em||'',wa:localStorage.bos_wa||''},L=x=>'₦'+x.toLocaleString();
 REP=`${lab} report ${f} to ${t}: billed ${L(billed)}, paid ${L(paidT)}, balance owed ${L(billed-paidT)}\n`+rows.map(([c,b,p])=>`${c.name} (${c.id}): ${L(b)}, paid ${L(p)}, ${L(b-p)}`).join('\n');
 shell(`<header><button onclick="home()">← Back</button><b>📈 Finance report</b></header><main><div class="sec"><div class="row">${[['day','Daily'],['week','Weekly'],['month','Monthly'],['year','Annual']].map(([x,l])=>`<button class="${x===FR.k?'btn':'btn2'}" onclick="finRep('${x}')">${l}</button>`).join('')}</div><label>${{day:'Day',week:'Week',month:'Month',year:'Year'}[FR.k]}</label>${frOpts()}</div>
<div class="sec"><small class="muted">${f} to ${t}</small><div class="tot3"><div><b>${L(billed)}</b>Money made (billed)</div><div><b class="gr">${L(paidT)}</b>Paid by clients</div><div><b class="rd">${L(billed-paidT)}</b>Balance owed</div></div><p class="muted">All clients owe in total: ${L(owedAll)} · ${nv} visit(s)</p></div>
<div class="sec"><h3>By client</h3>${rows.map(([c,b,p])=>`<div class="rw"><span>${esc(c.name)} <small>${esc(c.id)}</small></span><span class="muted">${L(b)} · paid ${L(p)} · <b>${L(b-p)}</b></span></div>`).join('')||'<p class="muted">No activity in this period.</p>'}</div>
<div class="sec"><h3>Send this report</h3><div class="row"><button class="btn" onclick="repMail()">✉ Email</button><button class="btn2" onclick="repWa()">💬 WhatsApp</button><button class="btn2" onclick="repCsv()">CSV</button></div><p class="muted">Email goes to: ${esc(rec.em||'(none saved yet)')} · WhatsApp number: ${esc(rec.wa||'(none saved yet)')}</p></div>
<details class="sec"><summary><b>Automatic sending &amp; recipients</b></summary><label>Team email addresses (comma separated)</label><input id="rem" value="${esc(rec.em)}"><label>Team WhatsApp number</label><input id="rwa" value="${esc(rec.wa)}"><button class="btn2" onclick="saveRec()">Save recipients</button><button class="btn2" onclick="ejs('Bosman report',REP)">Send with EmailJS (optional)</button><button class="lnk" onclick="localStorage.removeItem('bos_ejs');toast('EmailJS settings cleared')">Reset EmailJS settings</button></details></main>`)}
const norm=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'234'+p.slice(1):p.startsWith('234')?p:'234'+p};
function repMail(){const e=localStorage.bos_em;if(!e)return toast('Save team emails first (Automatic sending & recipients)');location.href='mailto:'+encodeURIComponent(e)+'?subject='+encodeURIComponent(CFG.brand+' report')+'&body='+encodeURIComponent(REP)}
function repWa(){const w=localStorage.bos_wa;if(!w)return toast('Save a WhatsApp number first');window.open('https://wa.me/'+norm(w)+'?text='+encodeURIComponent(REP),'_blank')}
function repCsv(){const r=['Name,ID,Billed,Paid,Owed'].concat(FRR.map(([c,b,p])=>[c.name,c.id,b,p,b-p].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+r.join('\n')],{type:'text/csv'}));a.download='finance-report.csv';a.click()}
async function saveRec(){localStorage.bos_em=$('#rem').value.trim();localStorage.bos_wa=$('#rwa').value.trim();try{await db.collection('meta').doc('shop').set({teamEmails:localStorage.bos_em,teamWa:localStorage.bos_wa},{merge:true})}catch(_){}toast('Recipients saved');finRep()}
async function ejs(subject,message){try{let c=JSON.parse(localStorage.bos_ejs||'null');if(!c){const s=prompt('EmailJS Service ID'),t=prompt('EmailJS Template ID (uses to_email, subject, message)'),k=prompt('EmailJS Public Key'),to=prompt('Send reports to (email)');if(!s||!t||!k||!to)return;c={s,t,k,to};localStorage.bos_ejs=JSON.stringify(c)}
 await lib('https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js');emailjs.init({publicKey:c.k});await emailjs.send(c.s,c.t,{to_email:c.to,subject,message});toast('Report emailed')}catch(x){toast('EmailJS: '+(x.text||x.message||x))}}
/* ===== SEVERAL DRIVE ACCOUNTS ===== */
const GCID='82781954368-fvjhtoepaltghl613d9pi18364g51jkv.apps.googleusercontent.com',TOK={};let DA='';
const ACC=()=>{try{return JSON.parse(localStorage.bos_dacc)||[]}catch(_){return[]}};
function driveView(){shell(`<header><button onclick="home()">← Back</button><b>Google Drive</b></header><main>${ACC().map(e=>`<div class="card">${esc(e)}<button class="btn" onclick="driveBackup('${esc(e)}')">Back up now</button><button class="lnk" onclick="rmAcc('${esc(e)}')">Remove</button></div>`).join('')||'<p class="muted">No Drive account yet.</p>'}<button class="btn" onclick="addAcc()">Add Google account</button><p class="muted">Every account gets a full backup. After about an hour tap Back up now again to reconnect.</p></main>`)}
async function addAcc(){try{const t=await driveToken(),u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t}})).json(),e=(u.email||'').toLowerCase();if(!e)throw new Error('Could not read the account email');TOK[e]={t,e:Date.now()+3.4e6};localStorage.bos_dacc=JSON.stringify([...new Set([...ACC(),e])]);home()}catch(x){toast(x.message)}}
const rmAcc=e=>{localStorage.bos_dacc=JSON.stringify(ACC().filter(x=>x!==e));home()};
/* ===== MANUAL IMPORT COLUMN MATCHING ===== */
const IMP=['name','phone','email','addr','fabric','style','due','total','deposit','notes','dob','type'],AUTO={name:/name/i,phone:/phone|tel|mobile/i,email:/mail/i,addr:/addr/i,fabric:/fabric/i,style:/style/i,due:/collect|due/i,total:/total|amount|price/i,deposit:/deposit/i,notes:/note/i,dob:/birth|dob/i,type:/type|gender|sex/i};let IR=[];
function importF(){const i=document.createElement('input');i.type='file';i.accept='.csv,.xlsx,.xls';i.onchange=async()=>{try{await lib(XL);const wb=XLSX.read(await i.files[0].arrayBuffer());IR=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!IR.length)return toast('File is empty');const hs=Object.keys(IR[0]);
 ovl(`<h3>Match columns</h3><p>Pick which column of your file holds each detail.</p>${IMP.map(k=>`<label style="color:#bbb">${k}</label><select id="im_${k}"><option value="">(skip)</option>${hs.map(h=>`<option ${AUTO[k].test(h)?'selected':''} value="${esc(h)}">${esc(h)}</option>`).join('')}</select>`).join('')}<button class="btn" onclick="importGo()">Preview and import</button><button class="btn" onclick="$('#ovl').remove()">Cancel</button>`)}catch(x){toast(x.message)}};i.click()}
async function importGo(){try{const mp={};IMP.forEach(k=>mp[k]=$('#im_'+k).value);$('#ovl').remove();const out=[];let skip=0,n=cache.reduce((m,x)=>Math.max(m,+(x.id.split('-')[1]||0)),0);
 for(const r of IR){const c={status:'In progress',m:{}};IMP.forEach(k=>{if(mp[k])c[k]=String(r[mp[k]]).trim()});if(!c.name)continue;c.type=/^m/i.test(c.type||'')?'Male':'Female';
  if([...cache,...out].some(x=>!x.deleted&&x.name.toLowerCase()===c.name.toLowerCase()&&(x.phone||'')===(c.phone||''))){skip++;continue}
  c.id=CFG.prefix+'-'+String(++n).padStart(4,'0');c.createdBy={n:me.name,s:me.sid};c.updated=new Date().toISOString();c.updatedBy=c.createdBy;out.push(c)}
 if(!out.length)return toast('Nothing new to import ('+skip+' duplicates)');if(!confirm(`Import ${out.length} clients? (${skip} duplicates skipped). First: ${out[0].name}`))return;
 for(const c of out)await put(c);cache=await all();list();toast(out.length+' imported');sync()}catch(x){toast(x.message)}}

/* ===== VISIT REPORT + BACKUP BANNER ===== */
const allVisits=()=>cache.filter(c=>!c.deleted).flatMap(c=>[...(c.visits||[]).filter(v=>!v.del).map(v=>({d:v.date,c,n:v.n,s:v.style,f:v.fabric,p:v.pieces,t:v.total})),{d:c.vdate||(c.updated||'').slice(0,10),c,n:c.visit||1,s:c.style,f:c.fabric,p:c.pieces,t:c.total}]).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
function visitReport(m){m=m||new Date().toISOString().slice(0,7);const v=allVisits(),sel=v.filter(x=>(x.d||'').startsWith(m));
 shell(`<header><button onclick="home()">← Back</button><b>Visit report</b></header><main><label>Month and year</label><input type="month" id="vm" value="${esc(m)}" onchange="visitReport(this.value)"><div class="sec"><b>${sel.length} visit(s) in ${esc(m)}</b><br><small>All visits ever: ${v.length}</small></div>${sel.map(x=>`<div class="card"><b>${esc(x.c.name)}</b> <small>${esc(x.c.id)} · visit ${esc(x.n)}</small><br><small>${esc(x.d)} · ${esc(x.s)} · ${esc(x.f)} · ${esc(x.p)} pc</small></div>`).join('')||'<p class="muted">No visits this month.</p>'}<button class="btn" onclick="visitCsv()">Download all visits (CSV, date order)</button></main>`)}
function visitCsv(){const r=[['Date','Client ID','Name','Visit','Style','Fabric','Pieces','Total'].join(',')].concat(allVisits().map(x=>[x.d,x.c.id,x.c.name,x.n,x.s,x.f,x.p,x.t].map(y=>'"'+String(y??'').replace(/"/g,'""')+'"').join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+r.join('\n')],{type:'text/csv'}));a.download='All_Visits_in_order.csv';a.click()}
const markBk=async t=>{localStorage.bos_lastbk=Date.now();try{await db.collection('meta').doc('shop').set({lastBackup:Date.now(),lastBackupBy:me.name,lastBackupType:t},{merge:true})}catch(_){}bkBanner()};
async function pullBk(){try{const d=await db.collection('meta').doc('shop').get(),t=d.exists?+d.data().lastBackup||0:0;if(d.exists){const x=d.data();if(x.teamEmails)localStorage.bos_em=x.teamEmails;if(x.teamWa)localStorage.bos_wa=x.teamWa}if(t>(+localStorage.bos_lastbk||0))localStorage.bos_lastbk=t}catch(_){}bkBanner()}
function bkBanner(){const e=$('#bk');if(!e)return;const t=+localStorage.bos_lastbk||0;e.style.display=adm()&&Date.now()-t>6048e5?'block':'none';e.textContent=ACC().length?'⚠ Backup due: tap Drive backup, or use Export → Full backup.':'⚠ Backup due: link Google Drive below, or use Export → Full backup.'}

/* ===== STAFF APPROVALS, STAFF CORNER, HR PICTURES, DELETE PASSWORD ===== */
let EDITOK=true;
const fillImgs=()=>document.querySelectorAll('img[data-ph]').forEach(async e=>{const p=await pget(e.dataset.ph);if(p){e.src=p.d;e.onclick=()=>big(e.dataset.ph)}});
async function loadPics(ids){for(const id of ids)if(!await pget(id)){const s=await db.collection('photos').doc(id.slice(3)).get();if(s.exists)await pput({id,d:s.data().d,up:1})}}
async function addHP(fs){try{HR.pics??=[];for(const f of fs)HR.pics.push(await pic(f));await saveHR();drawHR()}catch(x){toast(x.message)}}
async function rmHP(id){HR.pics=(HR.pics||[]).filter(x=>x!==id);await saveHR();drawHR()}
const bkData=()=>adm()?cache:cache.map(c=>{const x={...c};['phone','email','total','deposit','pay'].forEach(k=>delete x[k]);x.visits=(c.visits||[]).map(v=>({...v,total:undefined,deposit:undefined,pay:undefined}));return x});
async function adminOk(){const e=(prompt('Admin or owner email')||'').trim().toLowerCase(),p=e&&prompt('Their password');if(!p||![CFG.admin,CFG.owner].includes(e))return false;try{const s=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(firebaseConfig,'sec');await s.auth().signInWithEmailAndPassword(e,p);await s.auth().signOut();return true}catch(_){return false}}
async function del(){if(!(adm()?await askPw():await adminOk()))return toast('Not approved: wrong password');cur.deleted=true;saveC(true)}
function mineList(){const m=$('#mine');if(!m)return;const l=cache.filter(c=>!c.deleted&&(c.updatedBy?.s===me.sid||c.createdBy?.s===me.sid)).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
 m.innerHTML=l.length?l.map(c=>`<div class="card" onclick="clientForm('${esc(c.id)}')"><b>${esc(c.name)}</b> <small>${esc(c.id)}</small><br><small>Customer ${c.createdBy?.s===me.sid?'added':'updated'} by me · ${esc((c.updated||'').slice(0,10))}</small></div>`).join(''):'<p class="muted">Customers you add or update will show here as "customer updated by me".</p>'}
async function checkAppr(){const e=$('#appr');if(!e||e.hidden||!cur?.id)return;try{const d=await db.collection('approvals').doc(me.email+'__'+cur.id).get(),x=d.exists?d.data():null,ok=!!(x&&x.status==='approved'&&x.exp>Date.now());EDITOK=ok;
 document.querySelectorAll('main input,main select,main textarea').forEach(i=>i.disabled=!ok);
 e.innerHTML=ok?`✅ Approved to edit until ${new Date(x.exp).toTimeString().slice(0,5)}`:x&&x.status==='pending'?`⏳ Waiting for admin/owner approval <button class="bv" onclick="checkAppr()">Check again</button>`:`🔒 ${x&&x.status==='rejected'?'Request was rejected. ':''}Editing needs approval from admin or owner <button class="btn" onclick="reqAppr()">Request approval to edit</button>`}catch(err){e.textContent='🔒 Needs internet to check approval'}}
async function reqAppr(){try{await db.collection('approvals').doc(me.email+'__'+cur.id).set({email:me.email,by:me.name,sid:me.sid,cid:cur.id,cname:cur.name||'',status:'pending',at:Date.now()});toast('Request sent to admin and owner');checkAppr()}catch(x){toast(x.message)}}
async function loadApr(){const e=$('#apr');if(!e||!adm()||!db||!navigator.onLine)return;try{const s=await db.collection('approvals').where('status','==','pending').get();
 e.innerHTML=s.empty?'':`<div class="alert"><b>🔔 ${s.size} staff request(s) to edit a client</b>${s.docs.map(d=>{const x=d.data();return`<div class="card"><b>${esc(x.by)}</b> (${esc(x.sid)}) wants to edit <b>${esc(x.cname)}</b> ${esc(x.cid)}<div class="row"><button class="btn" onclick="decide('${esc(d.id)}',1)">Approve (2 hours)</button><button class="btn2" onclick="decide('${esc(d.id)}',0)">Reject</button></div></div>`}).join('')}</div>`}catch(_){}}
const decide=async(id,ok)=>{try{await db.collection('approvals').doc(id).update(ok?{status:'approved',exp:Date.now()+72e5,approvedBy:me.name}:{status:'rejected'});toast(ok?'Approved for 2 hours':'Rejected');loadApr()}catch(x){toast(x.message)}};
setInterval(loadApr,3e4);

addEventListener('error',e=>toast('Error: '+e.message));addEventListener('unhandledrejection',e=>toast('Error: '+(e.reason&&e.reason.message||e.reason)));
/* ===== BOOT ===== */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let cr0=null;try{cr0=JSON.parse(localStorage.bos_cred)}catch(_){}
if(auth&&!localStorage.bos_locked){auth.onAuthStateChanged(u=>{if(u&&cr0&&cr0.me.email===(u.email||'').toLowerCase()&&!me){me=cr0.me;start()}else if(!u&&!me)loginView()})}else loginView();
</script></body></html>
